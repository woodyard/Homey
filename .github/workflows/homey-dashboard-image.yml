# Builds the homey-dashboard Docker image and pushes it to GitHub Container Registry
# (ghcr.io/woodyard/homey-dashboard). The NAS picks up the new :latest image on its own
# (see homey-dashboard/nas/update.sh).
name: homey-dashboard image

on:
  push:
    branches: [main]
    paths:
      - 'homey-dashboard/**'
      - '!homey-dashboard/README.md'
      - '!homey-dashboard/nas/**'
      - '.github/workflows/homey-dashboard-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: homey-dashboard-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 is for the ARM-based Synology models (DS2xx/DS1xx value series). If the NAS
      # is Intel/AMD (`uname -m` prints x86_64), drop linux/arm64 below and the build gets
      # several minutes faster.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homey-dashboard
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: homey-dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
